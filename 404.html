<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{title} - boring_student</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon">
        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="/static/style.css?v={version}">
        <script>
            window.__APP__ = {{
                title: '{title}',
                repoOwner: '{repo_owner}',
                repoName: '{repo_name}',
                defaultBranch: '{default_branch}'
            }};
        </script>
    </head>
    <body>
        <div class="container">
            <h1><span id="pageTitle">加载中...</span><span class="refresh-countdown" id="refreshCountdown">45s</span><span class="total-usage" id="totalUsage"></span></h1>
            <div id="breadcrumbs" style="margin: 20px 0; font-size: 1.1em;"></div>
            <div id="fileListContainer" class="loading">加载中...</div>
        </div>
        <button class="btn" onclick="openUploadModal()" style="position: fixed; bottom: 30px; right: 30px; z-index: 100;">上传文件</button>
        <div class="auth-bar" style="position: fixed; top: 20px; right: 30px; z-index: 100; display: flex; align-items: center; gap: 10px;">
            <span id="authUser" style="display: none; background: rgba(255, 255, 255, 0.9); padding: 10px 15px; border-radius: 8px; color: #333; font-size: 14px; box-shadow: 0 0 10px rgba(0,0,0,0.1);"></span>
            <button class="btn" id="accountBtn" onclick="openAccountModal()" style="display: none; background: #16a085;">我的账户</button>
            <button class="btn" id="adminBtn" onclick="openAdminModal()" style="display: none; background: #6c5ce7;">用户管理</button>
            <button class="btn" id="authBtn" onclick="handleAuthBtnClick()">登录</button>
        </div>
        <div id="refreshIndicator" class="refresh-indicator" title="正在刷新"></div>

        <div id="svcStatus" class="svc-status" title="点击重新检测">
            <span id="svcStatusText">服务检测中…</span>
            <div id="svcStatusTip" class="svc-status-tip"></div>
        </div>

        <div id="loginModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeLoginModal()">&times;</span>
                <h2>登录</h2>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码">
                </div>
                <div class="form-group checkbox-row">
                    <input type="checkbox" id="loginRememberPwd" checked>
                    <label for="loginRememberPwd">记住密码</label>
                </div>
                <button class="btn" onclick="doLogin()" id="loginBtn" style="width: 100%;">登录</button>
                <div id="loginMessage" class="message"></div>
            </div>
        </div>

        <div id="uploadModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeUploadModal()">&times;</span>
                <h2>上传文件</h2>
                <div id="dropZone" class="drop-zone">拖拽文件或文件夹到此处<br>或点击选择文件</div>
                <input type="file" id="fileInput" multiple style="display: none;">
                <input type="file" id="folderInput" webkitdirectory style="display: none;">
                <div class="btn-row">
                    <button class="btn" id="pickFileBtn">选择文件</button>
                    <button class="btn" id="pickFolderBtn">选择文件夹</button>
                </div>
                <div class="btn-row concurrency-row">
                    <label for="concurrencySelect">上传并行数</label>
                    <select id="concurrencySelect">
                        <option value="auto">自适应</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="5">5</option>
                        <option value="custom">自定义</option>
                    </select>
                    <input type="number" id="concurrencyCustom" min="1" max="10" value="4" style="display: none;">
                </div>
                <div id="selectedFiles"></div>
                <div class="progress-container" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
                <div id="chunkPanel" style="display: none;">
                    <div id="chunkPanelToggle">
                        <span id="chunkPanelArrow">▸</span> 分片详情 <span id="chunkPanelSummary"></span>
                    </div>
                    <div id="chunkList" style="display: none;"></div>
                </div>
                <div id="speedPanel" style="display: none;">
                    <div id="speedPanelToggle">
                        <span id="speedPanelArrow">▸</span> 速度曲线 <span id="speedPanelPeak"></span>
                    </div>
                    <canvas id="speedGraph" style="display: none;"></canvas>
                    <div id="speedLegend" style="display: none;">
                        <i style="background: #2c82c9;"></i><span id="ulLegendTot">总</span>
                        <i style="background: #28a745;"></i><span id="ulLegendEo">EO</span>
                        <i style="background: #e67e22;"></i><span id="ulLegendCf">CF</span>
                    </div>
                </div>
                <button class="btn" onclick="stopUploadRollback()" id="stopUploadBtn" style="width: 100%; margin-top: 10px; display: none; background: #e67e22;">停止上传并回退</button>
                <button class="btn" onclick="uploadFile()" id="uploadBtn" style="width: 100%; margin-top: 15px;">开始上传</button>
                <div id="uploadMessage" class="message"></div>
            </div>
        </div>

        <div id="deleteModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeDeleteModal()">&times;</span>
                <h2>删除文件</h2>
                <p id="deleteConfirmText"></p>
                <div id="deleteAuthFields">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="deleteUsername" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="deletePassword" placeholder="请输入密码">
                    </div>
                </div>
                <button class="btn" onclick="confirmDelete()" id="deleteBtn" style="width: 100%;">确认删除</button>
                <button class="btn" onclick="stopDelete()" id="deleteStopBtn" style="width: 100%; margin-top: 8px; display: none; background: #e67e22;">停止删除</button>
                <div class="progress-container" id="deleteProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="deleteProgressFill"></div>
                    </div>
                    <div class="progress-text" id="deleteProgressText">0%</div>
                </div>
                <div id="deleteMessage" class="message"></div>
            </div>
        </div>

        <div id="previewModal" class="modal-overlay">
            <div class="modal-content preview-modal-content">
                <span class="modal-close" onclick="closePreviewModal()">&times;</span>
                <h2 id="previewTitle">预览文件</h2>
                <div id="previewContent"></div>
                <div id="previewActions" style="margin-top: 15px; display: none;">
                    <button class="btn" onclick="savePreviewFile()" id="savePreviewBtn" style="width: 100%;">保存修改</button>
                    <div id="previewMessage" class="message"></div>
                </div>
            </div>
        </div>

        <div id="propertiesModal" class="modal-overlay">
            <div class="modal-content preview-modal-content">
                <span class="modal-close" onclick="document.getElementById('propertiesModal').classList.remove('show')">&times;</span>
                <h2 id="propertiesTitle">属性</h2>
                <div id="propertiesContent"></div>
            </div>
        </div>

        <div id="accountModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeAccountModal()">&times;</span>
                <h2>我的账户</h2>
                <h3 class="modal-section">修改密码</h3>
                <div class="form-group">
                    <label>当前密码</label>
                    <input type="password" id="cpCurrent" placeholder="请输入当前密码">
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="cpNew" placeholder="大于8位，含大小写字母和数字">
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="cpConfirm" placeholder="再次输入新密码">
                </div>
                <button class="btn" onclick="changeOwnPassword()" id="cpBtn" style="width: 100%;">修改密码</button>
                <h3 class="modal-section modal-section-danger">注销账户</h3>
                <div class="form-group">
                    <label>输入密码确认注销</label>
                    <input type="password" id="daPassword" placeholder="注销后账户将被永久删除">
                </div>
                <button class="btn" onclick="deleteOwnAccount()" id="daBtn" style="width: 100%; background: #dc3545;">永久注销账户</button>
                <div id="accountMessage" class="message"></div>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content preview-modal-content">
                <span class="modal-close" onclick="closeAdminModal()">&times;</span>
                <h2>用户管理 <button class="icon-btn" id="adminRefreshBtn" onclick="loadAdminUsers()" title="刷新">⟳</button></h2>
                <div class="form-group">
                    <input type="text" id="adminSearchInput" placeholder="搜索用户名" oninput="renderAdminUserList()">
                </div>
                <div id="adminListToggle" class="admin-list-toggle" onclick="toggleAdminUserList()">用户列表 <span id="adminListArrow">▾</span></div>
                <div id="adminUserList" class="admin-user-list">
                    <div class="loading">加载中...</div>
                </div>
                <h3 class="modal-section">添加用户</h3>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="adminNewUsername" placeholder="新用户名">
                </div>
                <div class="form-group">
                    <label>密码（明文，将加密存储）</label>
                    <input type="password" id="adminNewPassword" placeholder="新用户密码">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="adminNewRole">
                        <option value="user" selected>user</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <button class="btn" onclick="adminAddUser()" id="adminAddBtn" style="width: 100%;">添加用户</button>
                <div id="adminMessage" class="message"></div>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <div id="bgTaskBubble" class="bg-task-bubble" style="display: none;">
            <span id="bgTaskText"></span>
            <button type="button" id="bgTaskClose" title="关闭提示">&times;</button>
        </div>

        <div id="taskProgress" class="task-progress">
            <div class="task-progress-top">
                <span id="taskProgressText"></span>
                <span id="taskDlCur" title="当前实际并行数"></span>
                <select id="taskDlConc" title="下载并行数">
                    <option value="auto" selected>并行: 自适应</option>
                    <option value="1">并行: 1</option>
                    <option value="2">并行: 2</option>
                    <option value="3">并行: 3</option>
                    <option value="4">并行: 4</option>
                    <option value="6">并行: 6</option>
                    <option value="8">并行: 8</option>
                    <option value="custom">并行: 自定义</option>
                </select>
                <input type="number" id="taskDlConcCustom" min="1" max="16" value="5" title="自定义并行数 (1-16)" style="display: none;">
                <button type="button" id="taskDlGraphToggle" class="task-progress-graph-btn" title="速度曲线">曲线</button>
                <button type="button" id="taskProgressCancel" class="task-progress-cancel" title="停止" style="display: none;">&times;</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="taskProgressFill"></div>
            </div>
            <canvas id="taskDlGraph" style="display: none;"></canvas>
            <div id="taskDlLegend" style="display: none;">
                <i style="background: #2c82c9;"></i><span id="taskDlLegendTot">总</span>
                <i style="background: #28a745;"></i><span id="taskDlLegendEo">EO</span>
                <i style="background: #e67e22;"></i><span id="taskDlLegendCf">CF</span>
            </div>
        </div>

        <div id="batchBar" class="batch-bar">
            <span id="batchCount"></span>
            <button class="btn" id="batchSelectAllBtn" style="background: #6c757d;">全选</button>
            <button class="btn" id="batchInvertBtn" style="background: #6c757d;">反选</button>
            <button class="btn" id="batchDownloadBtn">批量下载</button>
            <button class="btn" id="batchStopBtn" style="background: #e67e22; display: none;">停止下载</button>
            <button class="btn" id="batchDeleteBtn" style="background: #dc3545;">批量删除</button>
            <button class="btn" id="batchCancelBtn" style="background: #999;">取消</button>
        </div>

        <div id="contextMenu" class="context-menu">
            <div class="context-menu-item" id="menuProperties" onclick="handleMenuAction('properties')">属性</div>
            <div class="context-menu-item" id="menuPreview" onclick="handleMenuAction('preview')">预览</div>
            <div class="context-menu-item" id="menuEdit" onclick="handleMenuAction('edit')">修改</div>
            <div class="context-menu-item" id="menuDownload" onclick="handleMenuAction('download')">下载</div>
            <div class="context-menu-item danger" id="menuDelete" onclick="handleMenuAction('delete')">删除</div>
        </div>

        <script src="/static/app.js?v={version}"></script>
    </body>
</html>
