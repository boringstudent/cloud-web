<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{title} - boring_student</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon">
        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
        <script>
            // 主题预初始化：在样式表加载前确定明暗，避免首屏闪烁（默认跟随系统）
            (function() {{
                var m = 'auto';
                try {{ m = localStorage.getItem('cloud_web_theme') || 'auto'; }} catch (e) {{}}
                var dark = m === 'dark' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            }})();
        </script>
        <link rel="stylesheet" href="/static/style.css?v={version}">
        <script>
            window.__APP__ = {{
                title: '{title}',
                repoOwner: '{repo_owner}',
                repoName: '{repo_name}',
                defaultBranch: '{default_branch}'
            }};
        </script>
    </head>
    <body>
        <div class="container">
            <h1><span id="pageTitle">加载中...</span><span class="refresh-countdown" id="refreshCountdown">45s</span><span class="total-usage" id="totalUsage"></span></h1>
            <div id="breadcrumbs" style="margin: 20px 0; font-size: 1.1em;"></div>
            <div class="search-wrap">
                <!-- 隐藏诱饵输入框：浏览器填充密码时会把用户名填给离密码框最近的
                     上一个文本框，诱饵吸收掉这次误填，搜索框不受影响 -->
                <input type="text" class="autofill-decoy" tabindex="-1" autocomplete="off" aria-hidden="true">
                <input type="text" id="searchInput" placeholder="搜索当前目录…" autocomplete="nope" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" name="search-no-autofill" readonly>
                <button type="button" id="searchBtn" class="search-btn" title="搜索" onclick="triggerSearch()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg></button>
            </div>
            <div id="fileListContainer" class="loading">加载中...</div>
        </div>
        <button class="btn" id="uploadFabBtn" onclick="openUploadModal()">上传文件</button>
        <button class="btn" id="mediaUploadFabBtn" onclick="openMediaUploadModal()" style="background: #6c5ce7; right: 30px; bottom: 90px;">媒体上传</button>
        <div class="auth-bar" style="position: fixed; top: 20px; right: 30px; z-index: 1200; display: flex; align-items: center; gap: 10px;">
            <div class="pref-wrap">
                <select id="themeSelect" title="主题 / Theme">
                    <option value="auto">跟随系统</option>
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                </select>
                <select id="langSelect" title="语言 / Language">
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
            <button class="btn" id="authBtn" onclick="handleAuthBtnClick()">登录</button>
            <div id="userMenuWrap" class="user-menu-wrap" style="display: none;">
                <button type="button" id="userAvatarBtn" class="user-avatar-btn" title="账户菜单" onclick="toggleUserMenu(event)"></button>
                <div id="userMenu" class="user-menu">
                    <div class="user-menu-name" id="userMenuName"></div>
                    <div class="user-menu-item" onclick="closeUserMenu(); openAccountModal();">用户信息修改</div>
                    <div class="user-menu-item" id="userMenuAdmin" onclick="closeUserMenu(); openAdminModal();" style="display: none;">用户管理</div>
                    <div class="user-menu-item" id="userMenuStats" onclick="closeUserMenu(); openStatsModal();" style="display: none;">访问统计</div>
                    <div class="user-menu-item danger" onclick="closeUserMenu(); logout();">退出登录</div>
                </div>
            </div>
        </div>
        <div id="refreshIndicator" class="refresh-indicator" title="正在刷新"></div>

        <div id="svcStatus" class="svc-status">
            <span id="svcStatusText">服务检测中…</span>
            <div id="svcStatusTip" class="svc-status-tip"></div>
        </div>

        <div id="loginModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeLoginModal()">&times;</span>
                <h2>登录</h2>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                </div>
                <div class="form-group checkbox-row">
                    <input type="checkbox" id="loginRememberPwd" checked>
                    <label for="loginRememberPwd">记住密码</label>
                </div>
                <button class="btn" onclick="doLogin()" id="loginBtn" style="width: 100%;">登录</button>
                <div id="loginMessage" class="message"></div>
            </div>
        </div>

        <div id="uploadModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeUploadModal()">&times;</span>
                <h2>上传文件</h2>
                <div id="dropZone" class="drop-zone">拖拽文件或文件夹到此处<br>或点击选择文件</div>
                <input type="file" id="fileInput" multiple style="display: none;">
                <input type="file" id="folderInput" webkitdirectory style="display: none;">
                <div class="btn-row">
                    <button class="btn" id="pickFileBtn">选择文件</button>
                    <button class="btn" id="pickFolderBtn">选择文件夹</button>
                </div>
                <div class="btn-row concurrency-row">
                    <label for="concurrencySelect">上传并行数</label>
                    <select id="concurrencySelect">
                        <option value="auto">自适应</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="5">5</option>
                        <option value="custom">自定义</option>
                    </select>
                    <input type="number" id="concurrencyCustom" min="1" value="4" style="display: none;" title="手动并行数无上限，过大可能受浏览器单域名连接数限制">
                </div>
                <div class="btn-row concurrency-row">
                    <label>上传通道</label>
                    <button type="button" id="ulEoBtn" class="task-progress-graph-btn active" title="EO 上传通道开关（实时生效）">EO</button>
                    <button type="button" id="ulCfBtn" class="task-progress-graph-btn active" title="CF 上传通道开关（实时生效，需 CF 侧配置服务端 key）">CF</button>
                </div>
                <div id="selectedFiles"></div>
                <div class="progress-container" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
                <div id="chunkPanel" style="display: none;">
                    <div id="chunkPanelToggle">
                        <span id="chunkPanelArrow">▸</span> 分片详情 <span id="chunkPanelSummary"></span>
                    </div>
                    <div id="chunkList" style="display: none;"></div>
                </div>
                <div id="speedPanel" style="display: none;">
                    <div id="speedPanelToggle">
                        <span id="speedPanelArrow">▸</span> 速度曲线 <span id="speedPanelPeak"></span>
                    </div>
                    <canvas id="speedGraph" style="display: none;"></canvas>
                    <div id="speedLegend" style="display: none;">
                        <i style="background: #2c82c9;"></i><span id="ulLegendTot">总</span>
                        <i style="background: #28a745;"></i><span id="ulLegendEo">EO</span>
                        <i style="background: #e67e22;"></i><span id="ulLegendCf">CF</span>
                    </div>
                </div>
                <button class="btn" onclick="restartUploadTasks()" id="restartUploadBtn" style="width: 100%; margin-top: 10px; display: none; background: #2c82c9;">重启在途任务</button>
                <button class="btn" onclick="stopUploadRollback()" id="stopUploadBtn" style="width: 100%; margin-top: 10px; display: none; background: #e67e22;">停止上传并回退</button>
                <button class="btn" onclick="uploadFile()" id="uploadBtn" style="width: 100%; margin-top: 15px;">开始上传</button>
                <div id="uploadMessage" class="message"></div>
            </div>
        </div>

        <div id="mediaUploadModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeMediaUploadModal()">&times;</span>
                <h2>媒体上传</h2>
                <div class="form-group">
                    <label>媒体类型</label>
                    <select id="mediaType">
                        <option value="电影">电影</option>
                        <option value="剧集">剧集</option>
                        <option value="漫画">漫画</option>
                        <option value="动画">动画</option>
                        <option value="音乐">音乐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>名称（作为文件夹名）</label>
                    <input type="text" id="mediaName" placeholder="例如：进击的巨人">
                </div>
                <div class="form-group" id="mediaEpGroup">
                    <label>集数/期号（可选，作为子文件夹名）</label>
                    <input type="text" id="mediaEpisode" placeholder="例如：01 或 第一季">
                </div>
                <div id="mediaDropZone" class="drop-zone">拖拽文件到此处<br>或点击选择文件</div>
                <input type="file" id="mediaFileInput" multiple style="display: none;">
                <div class="btn-row">
                    <button class="btn" id="mediaPickFileBtn">选择文件</button>
                </div>
                <div id="mediaSelectedFiles"></div>
                <button class="btn" onclick="startMediaUpload()" id="mediaUploadBtn" style="width: 100%; margin-top: 15px;">开始上传</button>
                <div id="mediaUploadMessage" class="message"></div>
            </div>
        </div>

        <div id="deleteModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeDeleteModal()">&times;</span>
                <h2>删除文件</h2>
                <p id="deleteConfirmText"></p>
                <div id="deleteAuthFields">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="deleteUsername" placeholder="请输入用户名" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="deletePassword" placeholder="请输入密码" autocomplete="current-password">
                    </div>
                </div>
                <button class="btn" onclick="confirmDelete()" id="deleteBtn" style="width: 100%;">确认删除</button>
                <button class="btn" onclick="stopDelete()" id="deleteStopBtn" style="width: 100%; margin-top: 8px; display: none; background: #e67e22;">停止删除</button>
                <div class="progress-container" id="deleteProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="deleteProgressFill"></div>
                    </div>
                    <div class="progress-text" id="deleteProgressText">0%</div>
                </div>
                <div id="deleteMessage" class="message"></div>
            </div>
        </div>

        <div id="previewModal" class="modal-overlay">
            <div class="modal-content preview-modal-content">
                <span class="modal-close" onclick="closePreviewModal()">&times;</span>
                <h2 id="previewTitle">预览文件</h2>
                <div id="previewContent"></div>
                <div id="previewActions" style="margin-top: 15px; display: none;">
                    <button class="btn" onclick="savePreviewFile()" id="savePreviewBtn" style="width: 100%;">保存修改</button>
                    <div id="previewMessage" class="message"></div>
                </div>
            </div>
        </div>

        <div id="propertiesModal" class="modal-overlay">
            <div class="modal-content preview-modal-content">
                <span class="modal-close" onclick="document.getElementById('propertiesModal').classList.remove('show')">&times;</span>
                <h2 id="propertiesTitle">属性</h2>
                <div id="propertiesContent"></div>
            </div>
        </div>

        <div id="accountModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeAccountModal()">&times;</span>
                <h2>我的账户</h2>
                <div class="modal-tabs">
                    <div class="modal-tab active" data-tab="avatar" onclick="switchAccountTab('avatar')">头像</div>
                    <div class="modal-tab" data-tab="password" onclick="switchAccountTab('password')">密码</div>
                    <div class="modal-tab danger" data-tab="delete" onclick="switchAccountTab('delete')">注销</div>
                </div>
                <div class="modal-tab-panel" id="tabPanelAvatar">
                    <div class="form-group">
                        <label>头像 URL（留空使用默认图标）</label>
                        <input type="text" id="avUrl" placeholder="https://...">
                    </div>
                    <button class="btn" onclick="changeOwnAvatar()" id="avBtn" style="width: 100%; background: #16a085;">保存头像</button>
                </div>
                <div class="modal-tab-panel" id="tabPanelPassword" style="display: none;">
                    <div class="form-group">
                        <label>当前密码</label>
                        <input type="password" id="cpCurrent" placeholder="请输入当前密码" autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="cpNew" placeholder="大于8位，含大小写字母和数字" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="cpConfirm" placeholder="再次输入新密码" autocomplete="new-password">
                    </div>
                    <button class="btn" onclick="changeOwnPassword()" id="cpBtn" style="width: 100%;">修改密码</button>
                </div>
                <div class="modal-tab-panel" id="tabPanelDelete" style="display: none;">
                    <div class="form-group">
                        <label>输入密码确认注销</label>
                        <input type="password" id="daPassword" placeholder="注销后账户将被永久删除" autocomplete="current-password">
                    </div>
                    <button class="btn" onclick="deleteOwnAccount()" id="daBtn" style="width: 100%; background: #dc3545;">永久注销账户</button>
                </div>
                <div id="accountMessage" class="message"></div>
            </div>
        </div>

        <div id="adminModal" class="modal-overlay">
            <div class="modal-content preview-modal-content">
                <span class="modal-close" onclick="closeAdminModal()">&times;</span>
                <h2>用户管理
                    <button class="icon-btn" id="adminRefreshBtn" onclick="loadAdminUsers()" title="刷新">⟳</button>
                    <button class="btn" onclick="openAdminAddUser()" style="margin-left: 8px; padding: 4px 12px; font-size: 12px;">添加用户</button>
                </h2>
                <div class="form-group">
                    <input type="text" id="adminSearchInput" placeholder="搜索用户名" autocomplete="nope" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other" name="admin-search-no-autofill" oninput="renderAdminUserList()" readonly>
                </div>
                <div id="adminListToggle" class="admin-list-toggle" onclick="toggleAdminUserList()">用户列表 <span id="adminListArrow">▾</span></div>
                <div id="adminUserList" class="admin-user-list">
                    <div class="loading">加载中...</div>
                </div>
                <div id="adminMessage" class="message"></div>
            </div>
        </div>

        <div id="adminAddModal" class="modal-overlay">
            <div class="modal-content">
                <span class="modal-close" onclick="closeAdminAddModal()">&times;</span>
                <h2>添加用户</h2>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="adminNewUsername" placeholder="新用户名">
                </div>
                <div class="form-group">
                    <label>密码（明文，将加密存储）</label>
                    <input type="password" id="adminNewPassword" placeholder="新用户密码" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="adminNewRole">
                        <option value="user" selected>user</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>头像 URL（可选）</label>
                    <input type="text" id="adminNewAvatar" placeholder="https://...">
                </div>
                <button class="btn" onclick="adminAddUser()" id="adminAddBtn" style="width: 100%;">添加用户</button>
                <div id="adminAddMessage" class="message"></div>
            </div>
        </div>

        <div id="adminUserMenu" class="context-menu">
            <div class="context-menu-item" onclick="handleAdminMenuAction('password')">修改密码</div>
            <div class="context-menu-item" onclick="handleAdminMenuAction('role')">切换角色</div>
            <div class="context-menu-item danger" onclick="handleAdminMenuAction('delete')">删除用户</div>
        </div>

        <button type="button" id="backToTopBtn" title="返回顶部"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>

        <div id="toast" class="toast"></div>

        <div id="bgTaskBubble" class="bg-task-bubble" style="display: none;">
            <span id="bgTaskText"></span>
            <button type="button" id="bgTaskStop" title="停止任务" style="display: none;"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
            <button type="button" id="bgTaskClose" title="关闭提示">&times;</button>
        </div>

        <div id="taskProgress" class="task-progress">
            <div class="task-progress-top">
                <span id="taskProgressText"></span>
                <span id="taskDlCur" title="当前实际并行数"></span>
                <select id="taskDlConc" title="下载并行数">
                    <option value="auto" selected>并行: 自适应</option>
                    <option value="1">并行: 1</option>
                    <option value="2">并行: 2</option>
                    <option value="3">并行: 3</option>
                    <option value="4">并行: 4</option>
                    <option value="6">并行: 6</option>
                    <option value="8">并行: 8</option>
                    <option value="custom">并行: 自定义</option>
                </select>
                <input type="number" id="taskDlConcCustom" min="1" value="5" title="自定义并行数（无上限，过大可能受浏览器单域名连接数限制）" style="display: none;">
                <button type="button" id="taskDlEoBtn" class="task-progress-graph-btn active" title="EO 下载通道开关（实时生效）">EO</button>
                <button type="button" id="taskDlCfBtn" class="task-progress-graph-btn active" title="CF 下载通道开关（实时生效）">CF</button>
                <button type="button" id="taskDlExtBtn" class="task-progress-graph-btn" title="外部多代理下载（公共镜像加速，仅下载）">多代理</button>
                <button type="button" id="taskDlGraphToggle" class="task-progress-graph-btn" title="速度曲线">曲线</button>
                <button type="button" id="taskProgressRestart" class="task-progress-cancel" title="重启在途任务（换源重发）" style="display: none;">&#8635;</button>
                <button type="button" id="taskProgressCancel" class="task-progress-cancel" title="停止" style="display: none;">&times;</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="taskProgressFill"></div>
            </div>
            <canvas id="taskDlGraph" style="display: none;"></canvas>
            <div id="taskDlLegend" style="display: none;">
                <i style="background: #2c82c9;"></i><span id="taskDlLegendTot">总</span>
                <i style="background: #28a745;"></i><span id="taskDlLegendEo">EO</span>
                <i style="background: #e67e22;"></i><span id="taskDlLegendCf">CF</span>
                <i style="background: #9b59b6; display: none;"></i><span id="taskDlLegendExt" style="display: none;">外部</span>
            </div>
        </div>

        <div id="batchBar" class="batch-bar">
            <span id="batchCount"></span>
            <button class="btn" id="batchSelectAllBtn" style="background: #6c757d;">全选</button>
            <button class="btn" id="batchInvertBtn" style="background: #6c757d;">反选</button>
            <button class="btn" id="batchDownloadBtn">批量下载</button>
            <button class="btn" id="batchShareBtn" style="background: #6c5ce7;">分享链接</button>
            <button class="btn" id="batchStopBtn" style="background: #e67e22; display: none;">停止下载</button>
            <button class="btn" id="batchDeleteBtn" style="background: #dc3545;">批量删除</button>
            <button class="btn" id="batchCancelBtn" style="background: #999;">取消</button>
        </div>

        <div id="contextMenu" class="context-menu">
            <div class="context-menu-item" id="menuProperties" onclick="handleMenuAction('properties')">属性</div>
            <div class="context-menu-item" id="menuLocate" onclick="handleMenuAction('locate')" style="display: none;">跳转到所在目录并定位</div>
            <div class="context-menu-item" id="menuPreview" onclick="handleMenuAction('preview')">预览</div>
            <div class="context-menu-item" id="menuEdit" onclick="handleMenuAction('edit')">修改</div>
            <div class="context-menu-item" id="menuDownload" onclick="handleMenuAction('download')">下载</div>
            <div class="context-menu-item" id="menuShare" onclick="handleMenuAction('share')">复制外链</div>
            <div class="context-menu-item" id="menuQr" onclick="handleMenuAction('qr')">二维码下载</div>
            <div class="context-menu-item danger" id="menuDelete" onclick="handleMenuAction('delete')">删除</div>
        </div>

        <div id="shareModal" class="modal-overlay">
            <div class="modal-content" style="max-width: 420px;">
                <span class="modal-close" onclick="closeShareModal()">&times;</span>
                <h2 id="shareTitle">分享</h2>
                <div class="form-group">
                    <label>分享链接</label>
                    <input type="text" id="shareUrl" readonly onclick="this.select()">
                </div>
                <div class="btn-row" style="margin-bottom: 12px;">
                    <button class="btn" onclick="copyShareUrl()" id="copyShareBtn" style="flex: 1;">复制链接</button>
                    <button class="btn" onclick="openSharePage()" id="openSharePageBtn" style="flex: 1; background: #16a085;">打开下载页</button>
                </div>
                <div style="text-align: center; margin-top: 8px;">
                    <img id="shareQrImg" alt="二维码" style="max-width: 200px; border: 1px solid #eee; border-radius: 8px; display: none;">
                </div>
                <div id="shareMessage" class="message"></div>
            </div>
        </div>

        <div id="statsModal" class="modal-overlay">
            <div class="modal-content" style="max-width: 560px;">
                <span class="modal-close" onclick="closeStatsModal()">&times;</span>
                <h2>访问统计</h2>
                <div id="statsContent">
                    <div class="loading">加载中...</div>
                </div>
                <div class="btn-row" style="margin-top: 15px;">
                    <button class="btn" onclick="loadStats()" id="statsRefreshBtn" style="flex: 1;">刷新</button>
                </div>
                <div id="statsMessage" class="message"></div>
            </div>
        </div>
