    role: 人类文档：接口全集 / 功能与算法说明
  dataflow_ascii: |-
    浏览器
      |-- 同源 --> EO eo.js --+-- /api/login|users|change-*  --> GitHub boringstudent/cloud-user user.json
      |                       +-- /api.github.com/ | /raw.githubusercontent.com/ | /github.com/（白名单代理，服务端注入 key）--> GitHub boringstudent/cloud-storage
      |                       +-- /api/hash|proxies|my-ip|cf-ip|bg（公开接口）--> cip.cc / api.ip.sb / ipinfo.io / 图床
      |-- CF 加速通道 --> cloud-ecr.pages.dev (cf-worker.js，注入 GITHUB_TOKEN) --> GitHub
      |-- 外部多代理（仅下载）--> 69 个公共 ghproxy 镜像（浏览器侧实测可用性）
      +-- 背景图直连 loliapi 图床（不经 EO）
