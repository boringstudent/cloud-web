    role: CF 加速通道源码（部署 cloud-ecr.pages.dev）：GitHub 全站反向代理 + 服务端 GITHUB_TOKEN 注入 + /ip 出口 IP
  - name: test_eo_smoke.js
    role: eo.js 本地冒烟测试（Node 模拟 fetch 事件，44 项断言，不触网）
  - name: test_eo_server.js
    role: eo.js 本地模拟服务器（端到端预览）
