project:
  name: cloud-web
  summary: 基于 GitHub 仓库作存储后端的网页版网盘；全站一体部署于腾讯云 EdgeOne（EO）边缘函数：eo.js 单文件同时提供前端页面、静态资源、认证用户 API、GitHub 代理与下载中转；浏览器一切请求与站点同源，GitHub
    key 只存于 EO 服务端永不下发
  tech_stack: 零依赖、零框架、零 npm：前端原生 JS+CSS+单 HTML 模板；后端 EO 边缘函数 JS；构建脚本 Python 3；可选 CF Worker 加速通道
  repos:
    code: boringstudent/cloud-web（本仓库）
    storage: boringstudent/cloud-storage（网盘文件存储，构建时 CLOUD 环境变量可覆盖）
    user_data: boringstudent/cloud-user（user.json 用户数据，代理白名单永久拒绝 403）
